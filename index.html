<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kancelaria notarialne X&amp;Y — Kancelaria notarialna we Wrocławiu</title>
<meta name="description" content="Kancelaria notarialna we Wrocławiu: akty notarialne, poświadczenia, akty poświadczenia dziedziczenia, protokoły. Terminy umawiamy telefonicznie.">
<meta name="theme-color" content="#2B2523">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23F5EFE8'/%3E%3Cpath d='M8 16h48M8 48h48' stroke='%23A65E3A' stroke-width='3'/%3E%3Ctext x='32' y='40' font-family='Georgia,serif' font-weight='700' font-size='20' text-anchor='middle' fill='%232B2523'%3EX%26amp;Y%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&amp;display=swap">
<style>
:root{--ink:#2B2523;--acc:#A65E3A;--acc-d:#8A4526;--acc-l:#D79A73;--bg:#F5EFE8;--paper:#FFFDFA;--line:#DDD1C3;--mut:#5E5550;--lg-a:#A65E3A;--ok:#1F6B3A;--warn:#8A5A00;--bad:#9B2C2C;--hf:'Cinzel',Georgia,'Times New Roman',serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;overflow-x:hidden}
img{max-width:100%}
a{color:var(--acc-d)}
p{margin:0 0 1em}p:last-child{margin-bottom:0}
em{color:var(--acc-d)}
h1,h2,h3{font-family:var(--hf);font-weight:600;line-height:1.2;margin:0;letter-spacing:.02em}
h1 em,h2 em{font-style:normal}
:focus-visible{outline:3px solid #0B57D0;outline-offset:3px;border-radius:3px}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}
.skip{position:absolute;left:-999px;top:8px;background:#fff;padding:8px 14px;z-index:99}.skip:focus{left:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 24px;border:2px solid var(--ink);background:var(--ink);color:#fff;font:inherit;font-weight:600;text-decoration:none;border-radius:3px;cursor:pointer}
.btn:hover{background:#463c38}
.btn.acc{background:var(--acc-d);border-color:var(--acc-d)}.btn.acc:hover{background:#73391f}
.btn.ghost{background:transparent;color:var(--ink)}.btn.ghost:hover{background:rgba(43,37,35,.08)}
/* pasek komunikatów */
#topbar{background:var(--ink);color:#F5EFE8;font-size:.92rem}
#topbar a{display:flex;gap:10px;align-items:center;justify-content:center;padding:8px 16px;color:inherit;text-decoration:none;min-height:40px}
#topbar b{color:var(--acc-l);text-transform:uppercase;letter-spacing:.08em;font-size:.76rem}
#topbar .tb-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#topbar .tb-n{opacity:.8;font-size:.8rem;flex:none}
/* nagłówek */
#hdr{position:sticky;top:0;z-index:50;background:rgba(245,239,232,.97);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:16px;min-height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto;min-width:0}
.brand svg{width:44px;height:44px;flex:none}
.brand span{font-family:var(--hf);font-weight:600;font-size:.95rem;line-height:1.2;letter-spacing:.04em}
#nav{display:flex;gap:2px}
#nav a{padding:8px 10px;color:var(--ink);text-decoration:none;font-size:.95rem;border-radius:3px}
#nav a:hover{background:rgba(43,37,35,.08)}
.langs{display:flex;border:1px solid var(--ink);border-radius:3px;overflow:hidden;flex:none}
.langs button{font:inherit;font-size:.8rem;font-weight:700;padding:6px 8px;min-width:36px;min-height:34px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.langs button[aria-pressed=true]{background:var(--ink);color:#fff}
.burger{display:none;font:inherit;font-weight:600;background:transparent;border:1px solid var(--ink);border-radius:3px;min-height:36px;padding:4px 10px;color:var(--ink);cursor:pointer}
.hdr-call{flex:none;min-height:40px;padding:6px 16px}
.st{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;font-weight:600}
.st i{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.st.open{color:var(--ok)}.st.soon{color:var(--warn)}.st.closed{color:var(--bad)}
.st.open i,.st.soon i{animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.hdr-st{flex:none}
/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:52px;align-items:center;padding-block:60px 68px}
.eyebrow{font-size:.82rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--acc-d);margin:0 0 14px}
h1{font-size:clamp(1.85rem,4.4vw,3.1rem)}
h1 em{color:var(--acc-d)}
.hero-i{font-size:1.1rem;color:#3d3531;margin:20px 0 26px;max-width:56ch}
.hero-b{display:flex;flex-wrap:wrap;gap:12px}
.perks{list-style:none;padding:0;margin:26px 0 0;display:flex;flex-wrap:wrap;gap:8px 22px;font-size:.95rem}
.perks li{padding-left:20px;position:relative}.perks li::before{content:"";position:absolute;left:0;top:.72em;width:11px;height:2px;background:var(--acc)}
.slider{position:relative;aspect-ratio:4/3;max-height:540px;width:100%;overflow:hidden;border-radius:3px;box-shadow:16px 16px 0 -2px var(--bg),16px 16px 0 0 var(--acc)}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.2s}.slide.on{opacity:1}
.slide.on img{animation:zoom 6.2s linear forwards}
@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.07)}}
.dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:4px;z-index:2}
.dots button{width:28px;height:28px;border:0;background:transparent;cursor:pointer;padding:0;display:grid;place-items:center}
.dots button::before{content:"";width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
.dots button[aria-current=true]::before{background:var(--ink)}
.ph{position:relative;background:linear-gradient(135deg,#eadfd1,#cdbba8);display:grid;place-items:center;overflow:hidden;color:#40362f;font-size:.82rem;line-height:1.4;text-align:center;padding:14px;width:100%;height:100%}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* sekcje */
.sec{padding:68px 0}
.sec.alt{background:var(--paper);border-block:1px solid var(--line)}
.sec.dark{background:var(--ink);color:#F5EFE8;--lg-a:#D79A73}
.sec.dark em,.sec.dark a{color:var(--acc-l)}
.sec-h{max-width:70ch;margin-bottom:34px}
h2{font-size:clamp(1.45rem,3vw,2.05rem);padding-top:18px;position:relative}
h2::before{content:"";position:absolute;top:0;left:0;width:56px;height:3px;background:var(--acc)}
.sec.dark h2::before{background:var(--acc-l)}
.sec-i{margin-top:12px;color:var(--mut)}.sec.dark .sec-i{color:#e0d5c9}
h3{font-size:1.08rem;margin-bottom:6px}
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:22px}
.sec.alt .card{background:var(--bg)}
.card .ph{aspect-ratio:16/10;height:auto;margin-bottom:14px}
.card p{color:#3d3531}
.mut{color:var(--mut);font-size:.92rem}
.badge{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:999px;background:var(--acc-d);color:#fff;margin:0 6px 8px 0}
.badge.b2{background:var(--ink)}
/* lista usług */
.svc{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.svc li{display:grid;grid-template-columns:64px 1fr;gap:6px 18px;padding:22px 0;border-bottom:1px solid var(--line)}
.svc .n{font-family:var(--hf);font-size:1.5rem;color:var(--acc-d)}
.about{display:grid;grid-template-columns:1.1fr .9fr;gap:44px;align-items:start}
.about-p{display:grid;grid-template-columns:1fr 1fr;gap:14px}.about-p .ph{aspect-ratio:3/4;height:auto}
.about-p .ph:nth-child(2){margin-top:34px}
.feats{margin-top:38px}
.feats .card{border-top:3px solid var(--acc)}
.steps{list-style:none;padding:0;margin:0;counter-reset:s;display:grid;gap:26px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.steps li{counter-increment:s;border-top:1px solid rgba(245,239,232,.35);padding-top:16px}
.steps li::before{content:counter(s,decimal-leading-zero);font-family:var(--hf);font-size:1.6rem;color:var(--acc-l);display:block;margin-bottom:6px}
.steps p{color:#e0d5c9}
.check{list-style:none;padding:0;margin:0;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.check li{position:relative;padding:16px 18px 16px 52px;background:var(--paper);border:1px solid var(--line);border-radius:3px}
.check li::before{content:"✓";position:absolute;left:16px;top:14px;width:24px;height:24px;border-radius:50%;background:var(--acc-d);color:#fff;font-size:.85rem;display:grid;place-items:center}
.grid.team{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}.team .ph{aspect-ratio:4/5}
.role{color:var(--acc-d);font-weight:600;font-size:.92rem;margin-bottom:8px}
.tl{list-style:none;padding:0;margin:0;border-left:2px solid var(--acc);max-width:760px}
.tl li{position:relative;padding:0 0 26px 26px}.tl li::before{content:"";position:absolute;left:-8px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--acc);border:3px solid var(--paper)}
.tl .y{font-family:var(--hf);color:var(--acc-d);font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.filters button{font:inherit;font-size:.92rem;min-height:40px;padding:6px 16px;border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;cursor:pointer}
.filters button[aria-pressed=true]{background:var(--ink);color:#fff}
.gal{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.gal button{border:0;padding:0;background:none;cursor:zoom-in;text-align:left;font:inherit;color:inherit}
.gal .ph{aspect-ratio:4/3;height:auto}
.gal span.cap{display:block;font-size:.88rem;color:var(--mut);padding:6px 2px}
.revsum{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin-bottom:24px}
.revsum strong{font-family:var(--hf);font-size:2rem}
.stars{color:var(--acc-d);letter-spacing:2px}
details.q{border-bottom:1px solid var(--line)}
details.q summary{cursor:pointer;padding:18px 34px 18px 0;font-weight:600;list-style:none;position:relative}
details.q summary::-webkit-details-marker{display:none}
details.q summary::after{content:"+";position:absolute;right:6px;top:14px;font-size:1.4rem;color:var(--acc-d)}
details.q[open] summary::after{content:"–"}
details.q div{padding:0 0 18px;max-width:72ch}
.hours{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:start}
table.h{width:100%;border-collapse:collapse}
table.h th,table.h td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:400}
table.h td{text-align:right;font-variant-numeric:tabular-nums}
table.h tr.today th,table.h tr.today td{font-weight:700;background:rgba(166,94,58,.13)}
.tag{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;background:var(--acc-d);color:#fff;border-radius:999px;padding:1px 8px;margin-left:8px;font-weight:700}
.chg{list-style:none;padding:0;margin:8px 0 0}.chg li{padding:8px 0;border-bottom:1px solid var(--line)}
.contact{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:40px}
.cl{list-style:none;padding:0;margin:0 0 20px}.cl li{padding:10px 0;border-bottom:1px solid var(--line)}
.cl small{display:block;text-transform:uppercase;letter-spacing:.1em;font-size:.72rem;color:var(--mut);font-weight:700}
.cl a{font-weight:600;font-size:1.08rem}
.soc{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.soc a{min-width:44px;height:44px;padding:0 12px;border:1px solid var(--ink);border-radius:3px;display:grid;place-items:center;color:var(--ink);text-decoration:none;font-weight:700;font-size:.85rem}
.map{aspect-ratio:16/10;border:1px solid var(--line);margin-top:16px;background:#e6dbcd}
.map iframe{width:100%;height:100%;border:0;display:block}
form.q{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:26px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fg{margin-bottom:14px}
.fg label{display:block;font-weight:600;font-size:.93rem;margin-bottom:4px}
.fg input,.fg select,.fg textarea{width:100%;font:inherit;color:inherit;padding:11px 12px;border:1px solid #7a6f68;border-radius:3px;background:#fff;min-height:46px}
.fg textarea{min-height:120px;resize:vertical}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.93rem;margin-bottom:16px}
.chk input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--acc-d)}
.fmsg{margin-top:12px;font-weight:600;min-height:1.4em}.fmsg.err{color:var(--bad)}.fmsg.ok{color:var(--ok)}
/* stopka */
footer{background:var(--ink);color:#e9dfd3;padding:54px 0 96px;--lg-a:#D79A73}
footer a{color:#fff}
.ft{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:34px}
.ft-logo{width:230px;max-width:100%;color:#fff;display:block}
.ft-s{font-family:var(--hf);letter-spacing:.06em;margin:16px 0 0;color:var(--acc-l)}
.ft ul{list-style:none;padding:0;margin:0}.ft li{padding:4px 0}
.ft h3{font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;color:var(--acc-l);margin-bottom:10px}
.ft-b{border-top:1px solid rgba(255,255,255,.2);margin-top:34px;padding-top:18px;font-size:.88rem;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:#fff;text-decoration:underline;cursor:pointer}
/* pływające przyciski */
#mbar{display:none}
.fab{position:fixed;right:18px;bottom:18px;z-index:60;width:60px;height:60px;border-radius:50%;background:var(--acc-d);color:#fff;display:grid;place-items:center;text-decoration:none;font-size:1.5rem;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#lock{position:fixed;left:12px;bottom:12px;z-index:60;min-width:44px;height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:.88rem;font-weight:600;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.18)}
/* lightbox */
#lb{position:fixed;inset:0;z-index:90;background:rgba(20,16,14,.94);display:none;align-items:center;justify-content:center;padding:56px 12px}
#lb.on{display:flex}
#lb figure{margin:0;max-width:1100px;width:100%;color:#fff;text-align:center}
#lb .lb-i{height:min(72vh,720px)}#lb .lb-i img{object-fit:contain}
#lb .ph{background:#3a322e;color:#eee}
#lb button{position:absolute;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.5);width:48px;height:48px;border-radius:50%;font-size:1.4rem;cursor:pointer}
#lb .x{top:10px;right:10px}#lb .p{left:10px;top:50%}#lb .n{right:10px;top:50%}
@media (max-width:1040px){
  #nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--bg);border-bottom:1px solid var(--line);flex-direction:column;padding:8px 20px 16px}
  #nav.on{display:flex}#nav a{padding:12px 4px;border-bottom:1px solid var(--line)}
  .burger{display:block}.hdr-st{display:none}
}
@media (max-width:760px){
  body{font-size:16px}
  .hero,.about,.hours,.contact,.ft{grid-template-columns:1fr}
  .hero{padding-block:34px 46px;gap:34px}
  .slider{aspect-ratio:4/3;box-shadow:none}
  .sec{padding:48px 0}
  .hdr-call{display:none}.brand span{font-size:.78rem}.brand svg{width:38px;height:38px}
  .hdr-in{gap:8px}.langs button{min-width:32px;padding:6px 5px}
  .fr{grid-template-columns:1fr}.svc li{grid-template-columns:40px 1fr}
  .fab{display:none}
  #mbar{display:grid;grid-template-columns:1fr 1fr;position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--ink)}
  #mbar a{min-height:56px;display:flex;align-items:center;justify-content:center;gap:8px;color:#fff;font-weight:700;text-decoration:none}
  #mbar a:first-child{background:var(--acc-d)}
  #lock{bottom:68px}
  form.q{padding:18px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media print{#hdr,#topbar,#mbar,.fab,#lock,#cmsp-root{display:none!important}}

/* ===== UKŁAD WIELOSTRONICOWY, SIATKA (GRID) WG WZORCA „F” =====
   1. poziom F: nagłówek z menu · 2. poziom F: pas tytułowy podstrony
   pion F: tytuły sekcji w lewej kolumnie · prawa kolumna: stały panel kontaktu */
#nav a[aria-current=page]{box-shadow:inset 0 -3px 0 var(--acc);font-weight:700}
.hero-s,.phead{background:var(--paper);border-bottom:1px solid var(--line)}
.phead{padding:44px 0 34px;position:relative;overflow:hidden}
.phead .hero-i{margin:14px 0 18px}
.subnav{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px}
.subnav a{display:inline-block;padding:7px 14px;border:1px solid var(--ink);border-radius:999px;color:var(--ink);text-decoration:none;font-size:.92rem;min-height:38px}
.subnav a:hover{background:var(--ink);color:#fff}
.phead .wrap{position:relative}
.deco{position:absolute;right:20px;top:6px;width:220px;fill:none;stroke:var(--acc);stroke-width:5}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:52px;align-items:start;padding-bottom:70px}
#aside{position:sticky;top:86px;display:grid;gap:16px;margin-top:40px}
.box{background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--acc);padding:20px;border-radius:3px}
.box h2{font-size:1rem;padding:0;margin-bottom:10px}.box h2::before{display:none}
.box .btn{width:100%;margin:6px 0 10px}
table.h.sm{font-size:.9rem}table.h.sm th,table.h.sm td{padding:5px 6px}
.sec{padding:40px 0;border-bottom:1px solid var(--line)}
.sec.alt{background:none;border-block:0;border-bottom:1px solid var(--line)}
.sec.alt .card{background:var(--paper)}
.sec.dark{background:none;color:inherit}
.sec.dark h2::before{background:var(--acc)}.sec.dark .sec-i{color:var(--mut)}
.sec.dark .sec-c{background:var(--ink);color:#F5EFE8;padding:28px;border-radius:3px}
.sec-g{display:grid;grid-template-columns:190px minmax(0,1fr);gap:30px}
.sec-h{margin:0;max-width:none}
h2{font-size:clamp(1.15rem,1.9vw,1.4rem)}
.sec-i{font-size:.93rem}
.grid{grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:16px}
.about,.hours,.contact{grid-template-columns:1fr;gap:26px}
.about-p{max-width:460px}
.svc li{grid-template-columns:60px 1fr}
/* dynamiczne grafiki */
.ico{width:46px;height:46px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block;margin-bottom:10px;transition:transform .35s}
.ico .a{stroke:var(--acc)}
.sec.dark .ico{stroke:#F5EFE8}.sec.dark .ico .a{stroke:var(--acc-l)}
.ani *{stroke-dasharray:1}
.ani:not(.in) *{stroke-dashoffset:1}
.ani.in *{animation:draw 1.3s ease both}
.ani.in .a{animation-delay:.45s}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.card:hover .ico,.svc li:hover .ico,.steps li:hover .ico{transform:translateY(-4px) scale(1.06)}
.svc .n .ico{margin:0}
.ph{background:linear-gradient(120deg,#efe5d8,#d6c4b0,#efe5d8);background-size:220% 220%;animation:drift 14s ease-in-out infinite alternate}
.ph .ico.big{width:38%;max-width:150px;height:auto;aspect-ratio:1;margin:0;stroke-width:1.5;animation:float 7s ease-in-out infinite}
.ph>span{position:absolute;left:8px;right:8px;bottom:8px;font-size:.72rem}
.slide .ph>span{bottom:42px}
#lb .ph{animation:none;background:#3a322e}#lb .ph .ico{stroke:#eee}
@keyframes drift{from{background-position:0 50%}to{background-position:100% 50%}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (max-width:1040px){
  .layout{grid-template-columns:1fr;gap:0}
  #aside{position:static;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin:10px 0 0}
  #nav a[aria-current=page]{box-shadow:inset 3px 0 0 var(--acc);padding-left:12px}
}
@media (max-width:760px){
  .sec-g{grid-template-columns:1fr;gap:18px}
  .sec{padding:34px 0}
  .deco{display:none}
  .phead{padding:30px 0 26px}
  .sec.dark .sec-c{padding:20px}
  .svc li{grid-template-columns:50px 1fr}
}
@media (prefers-reduced-motion:reduce){.ani *{stroke-dashoffset:0!important}}

#h1:focus{outline:none}
/* sceny ilustracyjne w miejscach na zdjęcia */
.ph{animation:none;padding:0}
.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.slide.on .scene{animation:zoom 6.2s linear forwards}
.scene .glow{animation:glow 4s ease-in-out infinite alternate}
.scene .sig{stroke-dasharray:1;animation:draw 3.6s ease-in-out infinite alternate}
.scene .pen{animation:float 4s ease-in-out infinite}
.scene .hand{transform-origin:320px 76px;animation:spin 60s linear infinite}
.scene .leaf{transform-origin:361px 204px;animation:sway 5s ease-in-out infinite alternate}
.scene .cloud{animation:cloud 20s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.25}to{opacity:.75}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@keyframes cloud{to{transform:translateX(220px)}}

/* ================= PANEL ADMINISTRACYJNY (prefiks .cmsp-) ================= */
.cmsp{position:fixed;inset:0;z-index:1000;background:#F5EFE8;color:#2B2523;display:none;flex-direction:column;font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
.cmsp.cmsp-on{display:flex}
.cmsp *{box-sizing:border-box}
.cmsp-top{background:#2B2523;color:#fff;display:flex;align-items:center;gap:12px;padding:8px 16px;flex-wrap:wrap;--lg-a:#D79A73}
.cmsp-top svg{width:38px;height:38px;flex:none}
.cmsp-brand{margin-right:auto;line-height:1.25;min-width:0}.cmsp-brand b{display:block}.cmsp-brand small{color:#D79A73}
.cmsp-save{display:flex;align-items:center;gap:7px;font-size:.86rem}
.cmsp-save i{width:9px;height:9px;border-radius:50%;background:#6fd08c}.cmsp-save.cmsp-busy i{background:#f0c14b}.cmsp-save.cmsp-err i{background:#ff8a80}
.cmsp-btn{font:inherit;font-weight:600;min-height:38px;padding:6px 14px;border-radius:4px;border:1px solid #2B2523;background:#fff;color:#2B2523;cursor:pointer}
.cmsp-btn:hover{background:#efe6da}
.cmsp-btn.cmsp-pri{background:#8A4526;border-color:#8A4526;color:#fff}.cmsp-btn.cmsp-pri:hover{background:#73391f}
.cmsp-btn.cmsp-dark{background:#2B2523;color:#fff}
.cmsp-btn.cmsp-danger{border-color:#9B2C2C;color:#9B2C2C}.cmsp-btn[data-armed]{background:#9B2C2C;color:#fff;border-color:#9B2C2C}
.cmsp-btn.cmsp-sm{min-height:32px;padding:3px 9px;font-size:.84rem;font-weight:500}
.cmsp-top .cmsp-btn{border-color:#fff;background:transparent;color:#fff}.cmsp-top .cmsp-btn:hover{background:rgba(255,255,255,.15)}
.cmsp-main{flex:1;display:grid;grid-template-columns:250px minmax(0,1fr);min-height:0}
.cmsp-nav{background:#fffdfa;border-right:1px solid #DDD1C3;overflow-y:auto;padding:10px 0 30px}
.cmsp-nav h3{font:700 .7rem/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#5E5550;margin:16px 16px 6px}
.cmsp-nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;font:inherit;border:0;background:none;color:#2B2523;padding:8px 16px;min-height:38px;cursor:pointer;border-left:3px solid transparent}
.cmsp-nav button:hover{background:#f3ebe1}
.cmsp-nav button[aria-current=page]{background:#f3e4d8;border-left-color:#A65E3A;font-weight:700}
.cmsp-cnt{font-size:.74rem;font-weight:700;background:#e6dbcd;border-radius:999px;padding:1px 8px;color:#2B2523}
.cmsp-cnt.cmsp-g{background:#1F6B3A;color:#fff}
.cmsp-body{overflow-y:auto;padding:24px 28px 90px}
.cmsp-ph{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
.cmsp-ph h2{font:600 1.5rem/1.2 Cinzel,Georgia,serif;margin:0;padding:0}.cmsp-ph h2::before{display:none}
.cmsp-ph p{margin:4px 0 0;color:#5E5550;max-width:70ch}
.cmsp-box{background:#fffdfa;border:1px solid #DDD1C3;border-radius:6px;padding:18px;margin-bottom:20px}
.cmsp-box>h3{font:700 1rem/1.3 "Segoe UI",system-ui,sans-serif;margin:0 0 12px;letter-spacing:0}
.cmsp-bh{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px}.cmsp-bh h3{margin:0;font:700 1rem/1.3 "Segoe UI",system-ui,sans-serif;letter-spacing:0}
.cmsp-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #eadfd2;flex-wrap:wrap}
.cmsp-row.cmsp-hid{opacity:.55}
.cmsp-ord{display:flex;flex-direction:column;gap:2px}.cmsp-ord button{width:30px;height:22px;font-size:.66rem;border:1px solid #b9aa9a;background:#fff;border-radius:3px;cursor:pointer;color:#2B2523;padding:0}
.cmsp-ord button:disabled{opacity:.35;cursor:default}
.cmsp-th{width:52px;height:44px;border-radius:4px;background:#e6dbcd center/cover no-repeat;display:grid;place-items:center;font-weight:700;color:#5E5550;flex:none}
.cmsp-rt{flex:1;min-width:150px}.cmsp-rt b{display:block;overflow-wrap:anywhere}.cmsp-rt small{color:#5E5550}
.cmsp-acts{display:flex;gap:6px;flex-wrap:wrap}
.cmsp-bdg{font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.cmsp-b-g{background:#d6efdd;color:#134a26}.cmsp-b-y{background:#fbeab5;color:#5c4300}.cmsp-b-x{background:#e3ddd6;color:#4a423d}
.cmsp-empty{padding:18px;text-align:center;color:#5E5550;border:1px dashed #b9aa9a;border-radius:6px}
.cmsp-filt{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cmsp-filt button{font:inherit;font-size:.85rem;border:1px solid #b9aa9a;background:#fff;border-radius:999px;padding:4px 12px;min-height:32px;cursor:pointer;color:#2B2523}
.cmsp-filt button[aria-pressed=true]{background:#2B2523;color:#fff;border-color:#2B2523}
.cmsp-f{margin:0 0 14px;border:0;padding:0;min-width:0}
.cmsp-l,.cmsp-f legend{display:block;font-weight:600;font-size:.88rem;margin-bottom:4px;padding:0}
.cmsp-in{width:100%;font:inherit;color:#2B2523;padding:8px 10px;border:1px solid #7a6f68;border-radius:4px;background:#fff;min-height:38px}
textarea.cmsp-in{min-height:84px;resize:vertical}
.cmsp-in:disabled{background:#eee7de;color:#857b74}
.cmsp-ml{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.cmsp-ml legend{grid-column:1/-1}
.cmsp-lang{font-size:.68rem;font-weight:700;letter-spacing:.08em;color:#8A4526;display:block}
.cmsp-chk{display:flex;gap:8px;align-items:center;font-weight:600;font-size:.9rem}.cmsp-chk input{width:20px;height:20px;accent-color:#8A4526}
.cmsp-img{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.cmsp-prev{width:120px;height:86px;border-radius:4px;background:#e6dbcd center/cover no-repeat;display:grid;place-items:center;font-size:.72rem;color:#5E5550;flex:none}
.cmsp-g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.cmsp-hint{color:#5E5550;font-size:.85rem;margin:6px 0 0}
.cmsp-err{color:#9B2C2C;font-weight:600;min-height:1.3em;margin:6px 0}
.cmsp-warn{color:#7a4a00;font-weight:600;font-size:.85rem}
.cmsp-mbg{position:fixed;inset:0;z-index:1100;background:rgba(30,24,22,.6);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto;font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:#2B2523}
.cmsp-mbg *{box-sizing:border-box}
.cmsp-modal{background:#fffdfa;border-radius:8px;width:100%;max-width:760px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.cmsp-modal.cmsp-nar{max-width:400px}
.cmsp-modal h2{font:600 1.25rem/1.2 Cinzel,Georgia,serif;margin:0 0 14px;padding:0}.cmsp-modal h2::before{display:none}
.cmsp-mf{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.cmsp-mf .cmsp-danger{margin-left:auto}
.cmsp-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:1200;background:#2B2523;color:#fff;padding:10px 18px;border-radius:6px;font:600 15px/1.4 "Segoe UI",system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.35);max-width:92vw;text-align:center}
.cmsp-toast:empty{display:none}
.cmsp-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.cmsp-tile{text-align:left;font:inherit;background:#fffdfa;border:1px solid #DDD1C3;border-radius:6px;padding:14px;cursor:pointer;color:#2B2523}
.cmsp-tile:hover{border-color:#A65E3A}
.cmsp-tile b{display:block;font:600 1.5rem/1.2 Cinzel,Georgia,serif}.cmsp-tile small{color:#5E5550;display:block}
.cmsp-tile .cmsp-s-open{color:#1F6B3A}.cmsp-tile .cmsp-s-soon{color:#8A5A00}.cmsp-tile .cmsp-s-closed{color:#9B2C2C}
.cmsp-quick{display:flex;gap:8px;flex-wrap:wrap}
.cmsp-gantt{position:relative;overflow:hidden}
.cmsp-gr{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:center;padding:5px 0;font-size:.85rem}
.cmsp-gr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmsp-gt{position:relative;height:20px;background:#f0e7dc;border-radius:3px}
.cmsp-gt i{position:absolute;top:3px;bottom:3px;border-radius:3px;min-width:4px}
.cmsp-gt u{position:absolute;top:-5px;bottom:-5px;left:25%;width:2px;background:#9B2C2C}
.cmsp-ga{position:relative;height:18px;font-size:.72rem;color:#5E5550}.cmsp-ga em{position:absolute;font-style:normal;color:#5E5550;transform:translateX(-50%);white-space:nowrap}
.cmsp-leg{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;margin-top:8px}.cmsp-leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cmsp-c-g{background:#2e8b4e}.cmsp-c-y{background:#e0b020}.cmsp-c-x{background:#a59b92}
.cmsp-up{list-style:none;padding:0;margin:0}.cmsp-up li{padding:7px 0;border-top:1px solid #eadfd2}
.cmsp-hr{display:grid;grid-template-columns:130px 130px 1fr 1fr;gap:8px;align-items:center;padding:6px 0;border-top:1px solid #eadfd2}
.cmsp-sec{border-top:1px solid #eadfd2;padding:8px 0}
.cmsp-sec summary{cursor:pointer;padding:6px 0;color:#8A4526;font-weight:600;font-size:.88rem}
.cmsp-sech{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.cmsp-sech b{flex:1;min-width:140px}
textarea.cmsp-json{min-height:150px;font:12px/1.4 Consolas,Menlo,monospace}
@media (max-width:820px){
  .cmsp-main{display:flex;flex-direction:column}
  .cmsp-nav{display:flex;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid #DDD1C3;padding:0;flex:none}
  .cmsp-nav h3{display:none}
  .cmsp-nav button{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;padding:10px 12px}
  .cmsp-nav button[aria-current=page]{border-bottom-color:#A65E3A}
  .cmsp-body{padding:16px 12px 90px;flex:1}
  .cmsp-ml,.cmsp-g2{grid-template-columns:1fr}
  .cmsp-hr{grid-template-columns:1fr 1fr}
  .cmsp-gr{grid-template-columns:90px minmax(0,1fr)}
  .cmsp-brand small{display:none}
}

      body: L3('Zapraszamy do zapoznania się z zakresem czynności i informacjami praktycznymi. Terminy umawiamy telefonicznie.', 'You are welcome to explore our services and practical information. Appointments are made by phone.', 'Запрошуємо ознайомитися з переліком послуг і практичною інформацією. Запис — телефоном.'),

  about: {
    text: L3('Kancelaria notarialna zajmuje się dokonywaniem czynności prawnych, którym przepisy wymagają lub strony chcą nadać formę urzędową. Dbamy przy tym o **bezpieczeństwo** i **zgodność z prawem**.\n\nKlienci wybierają nas ze względu na doświadczenie, wiedzę i profesjonalizm. Obsługujemy osoby prywatne, małe firmy, jednoosobowe działalności oraz klientów zagranicznych — z Wrocławia i z całej Polski.',
      'A notary office performs legal acts which the law requires, or the parties wish, to be made in official form. In doing so we take care of **security** and **compliance with the law**.\n\nClients choose us for our experience, knowledge and professionalism. We serve private individuals, small companies, sole traders and foreign clients — from Wrocław and all over Poland.',
      'Нотаріальна контора вчиняє правові дії, яким закон вимагає або сторони бажають надати офіційної форми. При цьому ми дбаємо про **безпеку** та **відповідність закону**.\n\nКлієнти обирають нас за досвід, знання та професіоналізм. Ми обслуговуємо приватних осіб, малі фірми, індивідуальних підприємців та іноземних клієнтів — із Вроцлава та з усієї Польщі.'),

function idb() { return new Promise((res, rej) => { const r = indexedDB.open(DBN, 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); setTimeout(() => rej(new Error('timeout')), 1500); }); }
async function dbGet() {
  try { const db = await idb(); const v = await new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get('state'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); if (v) return v; } catch (e) { }

/* scalanie: zapisane dane nadpisują początkowe, ale nowe pola z kodu nie znikają */
function merge(def, sav) {
  if (Array.isArray(def)) return Array.isArray(sav) ? sav : def;
  if (def && typeof def === 'object') {
    if (!sav || typeof sav !== 'object' || Array.isArray(sav)) return def;
    const out = {}; for (const k in def) out[k] = k in sav ? merge(def[k], sav[k]) : def[k];
    for (const k in sav) if (!(k in out)) out[k] = sav[k];
    return out;
  }
  return sav === undefined || sav === null ? def : sav;
}

/* PODSTRONY: jedna aplikacja w jednym pliku, każda podstrona ma własny adres (#start, #strona-oferta…).
   Odnośnik do sekcji (np. #godziny) sam otwiera właściwą podstronę. */
const SITE_PAGES = [
  ['start', ['aktualnosci', 'onas', 'proces', 'opinie']],
  ['strona-oferta', ['oferta', 'firmy', 'przygotowanie', 'faq']],
  ['strona-kancelaria', ['zespol', 'historia', 'galeria', 'uprawnienia', 'nagrody', 'partnerzy']],
  ['strona-kontakt', ['godziny', 'kontakt', 'informacje']]

let route = 'start';
const pageOfSec = k => SITE_PAGES.find(p => p[1].includes(k))[0];
const pageOn = p => p[0] === 'start' || p[1].some(secOn);
function pageOf(id) { if (SITE_PAGES.some(p => p[0] === id)) return id; const s = SECS.find(x => x[1] === id); return s ? pageOfSec(s[0]) : null; }
function onHash(first) {
  const id = decodeURIComponent(location.hash.slice(1)) || 'start', pg = pageOf(id); if (!pg) return;
  const ch = pg !== route; route = pg; renderSite();
  const el = document.getElementById(id);
  if (id === pg || !el) { window.scrollTo(0, 0); if (ch && !first) { const h = $('#h1'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); } } }
  else el.scrollIntoView();
}
window.addEventListener('hashchange', () => onHash());

const cache = {};
function put(el, key, html) { if (cache[key] !== html) { cache[key] = html; el.innerHTML = html; } }
function rPhead() {

    + '<nav aria-label="' + u.onPage + '"><ul class="subnav">' + p[1].filter(secOn).map(k => '<li><a href="#' + secDef(k)[1] + '">' + inl(T(S.sections[k].title)) + '</a></li>').join('') + '</ul></nav>' + DECO + '</div></section>';
}

function renderSite() {

  if (!pageOn(SITE_PAGES.find(p => p[0] === route))) route = 'start';

  if (!main.children.length) main.innerHTML = '<div id="phead"></div><div class="wrap layout"><div id="content">' + SECS.map(s => '<div data-sec="' + s[0] + '"></div>').join('') + '</div><aside id="aside"></aside></div>';

    + '<div class="ft-b"><span>© ' + new Date().getFullYear() + ' ' + esc(S.firm.name) + '. ' + u.rights + '</span><span><button type="button" class="linkbtn" data-admin>' + u.admin + '</button> · ' + u.made + '</span><span style="flex-basis:100%">' + u.demo + '</span></div></div>');

function renderBar() {
  const items = activeNews().filter(n => n.bar), el = $('#topbar');

function showSlide(i) {
  const sl = $$('.slide'); if (!sl.length) return; slideI = (i + sl.length) % sl.length;
  sl.forEach((s, k) => s.classList.toggle('on', k === slideI));
  $$('.dots button').forEach((b, k) => b.setAttribute('aria-current', k === slideI));
}
/* lightbox */
let lbI = 0, lbPrev = null;
function lbShow(i) {
  const it = galItems(); if (!it.length) return; lbI = (i + it.length) % it.length; const g = it[lbI], u = U();
  $('#lb').innerHTML = '<button type="button" class="x" data-lbx aria-label="' + u.lbClose + '">×</button><button type="button" class="p" data-lbp aria-label="' + u.lbPrev + '">‹</button><button type="button" class="n" data-lbn aria-label="' + u.lbNext + '">›</button><figure><div class="lb-i">' + pic(g.img, T(g.caption), null, cyc(['reception', 'meet', 'building', 'office'], lbI)) + '</div><figcaption>' + esc(T(g.caption)) + ' · ' + (lbI + 1) + '/' + it.length + '</figcaption></figure>';
  $('#lb').classList.add('on'); $('#lb .x').focus();
}
function lbClose() { $('#lb').classList.remove('on'); $('#lb').innerHTML = ''; if (lbPrev && lbPrev.isConnected) lbPrev.focus(); }

/* zdarzenia strony */
document.addEventListener('click', e => {
  const t = e.target, q = s => t.closest(s);
  let b;
  if ((b = q('[data-lang]'))) { lang = b.dataset.lang; try { sessionStorage.setItem('kn_lang', lang); } catch (er) { } galCat = ''; renderSite(); const nb = $('[data-lang="' + lang + '"]'); nb && nb.focus(); return; }
  if ((b = q('.burger'))) { const on = $('#nav').classList.toggle('on'); b.setAttribute('aria-expanded', on); return; }
  if (q('#nav a')) { $('#nav').classList.remove('on'); const bg = $('.burger'); bg && bg.setAttribute('aria-expanded', 'false'); }
  if ((b = q('[data-slide]'))) { showSlide(+b.dataset.slide); return; }
  if ((b = q('[data-gcat]'))) { galCat = b.dataset.gcat; renderSite(); const nb = $$('[data-gcat]').find(x => x.dataset.gcat === galCat); nb && nb.focus(); return; }
  if ((b = q('[data-lb]'))) { lbPrev = b; lbShow(+b.dataset.lb); return; }
  if (q('[data-lbx]') || t.id === 'lb') { lbClose(); return; }
  if (q('[data-lbp]')) { lbShow(lbI - 1); $('#lb .p').focus(); return; }
  if (q('[data-lbn]')) { lbShow(lbI + 1); $('#lb .n').focus(); return; }
  if ((b = q('[data-admin]')) || (b = q('#lock'))) { adminEntry(b); return; }
  if (q('#qform [type=submit]')) { e.preventDefault(); sendForm(); return; }
});
document.addEventListener('submit', e => { if (e.target.id === 'qform') e.preventDefault(); });
function sendForm() {
  const v = id => $('#' + id).value.trim(), u = U(), msg = $('#qf-msg');
  if (!v('qf-n') || !(v('qf-p') || v('qf-e')) || !v('qf-m') || !$('#qf-c').checked) { msg.className = 'fmsg err'; msg.textContent = u.fErr; return; }

  info: { t: 'Informacje praktyczne', d: 'Parking, dojazd, płatności i dostępność. Puste pole chowa dany kafelek.', sec: 'informacje', b: () => [formBlock('', S.info, [{ k: 'parking', t: 'mlarea', l: 'Parking i dojazd samochodem' }, { k: 'transit', t: 'mlarea', l: 'Dojazd komunikacją miejską' }, { k: 'payments', t: 'mlarea', l: 'Metody płatności' }, { k: 'access', t: 'mlarea', l: 'Dostępność dla osób z niepełnosprawnościami' }], FMT_HINT)] },
  sections: { t: 'Sekcje strony', d: 'Włączanie i wyłączanie sekcji oraz ich tytuły i wprowadzenia.', sec: 'start', b: () => [sectionsBlock()] },
  settings: { t: 'Ustawienia', d: 'Hasło do logowania w panelu.', sec: 'start', b: () => [passBlock()] },
  backup: { t: 'Kopia zapasowa', d: 'Eksport i import wszystkich treści oraz przywracanie stanu początkowego.', sec: 'start', b: () => [backupBlock()] }
};
const NAV = [['Przegląd', ['dash']], ['Treści czasowe', ['news']], ['Oferta', ['services', 'biz', 'steps', 'prep']], ['Wizerunek', ['home', 'about', 'history', 'gallery', 'team']], ['Zaufanie', ['certs', 'awards', 'partners', 'reviews', 'faq']], ['Kancelaria', ['hours', 'contact', 'info']], ['Ustawienia', ['sections', 'settings', 'backup']]];
function navCounts() { $$('[data-cnt]').forEach(el => { const k = el.dataset.cnt; if (k === 'news') { el.textContent = activeNews().length; el.className = 'cmsp-cnt cmsp-g'; } else el.textContent = getP(S, COLS[k].path).length; }); }
function buildPanel() {
  const el = document.createElement('div'); el.className = 'cmsp'; el.id = 'cmsp'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', 'Panel administratora');
  el.innerHTML = '<div class="cmsp-top"><svg viewBox="0 0 200 200" aria-hidden="true"><use href="#lg-m"/></svg><div class="cmsp-brand"><b data-firm></b><small>Panel administratora</small></div><div class="cmsp-save" id="cmsp-save" role="status"><i></i><span>Zapisano</span></div><button type="button" class="cmsp-btn" data-top="view">Zobacz stronę</button><button type="button" class="cmsp-btn" data-top="out">Wyloguj</button></div>'
    + '<div class="cmsp-main"><nav class="cmsp-nav" aria-label="Menu panelu">' + NAV.map(g => '<h3>' + g[0] + '</h3>' + g[1].map(p => '<button type="button" data-page="' + p + '">' + PAGES[p].t + (COLS[p] ? ' <span class="cmsp-cnt" data-cnt="' + p + '"></span>' : '') + '</button>').join('')).join('') + '</nav><div class="cmsp-body" id="cmsp-body" tabindex="-1"></div></div>';
  root().appendChild(el);
  $('.cmsp-nav', el).addEventListener('click', e => { const b = e.target.closest('[data-page]'); if (b) go(b.dataset.page); });
  $('.cmsp-top', el).addEventListener('click', e => { const b = e.target.closest('[data-top]'); if (!b) return; if (b.dataset.top === 'view') closePanel(); else logout(); });
  $('#cmsp-body', el).addEventListener('click', bodyClick);
  CM.built = true;
}
function go(p) { CM.page = p; CM.filter = 'all'; CM.tick = null; renderPage(); $('#cmsp-body').scrollTop = 0; }
function renderPage() {
  const body = $('#cmsp-body'), pg = PAGES[CM.page], sc = body.scrollTop;
  $$('.cmsp-nav button').forEach(b => { if (b.dataset.page === CM.page) { b.setAttribute('aria-current', 'page'); b.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } else b.removeAttribute('aria-current'); });
  $('[data-firm]').textContent = S.firm.name;
  body.innerHTML = '<div class="cmsp-ph"><div><h2>' + pg.t + '</h2><p>' + pg.d + '</p></div><button type="button" class="cmsp-btn" data-act="view" data-sec="' + pg.sec + '">Zobacz na stronie</button></div>';
  pg.b().forEach(x => { if (typeof x === 'string') { const d = document.createElement('div'); d.innerHTML = colHTML(x); body.appendChild(d); } else body.appendChild(x); });
  body.scrollTop = sc; navCounts();
}
function openPanel() { if (!CM.built) buildPanel(); CM.open = true; $('#cmsp').classList.add('cmsp-on'); document.body.style.overflow = 'hidden'; renderPage(); $('.cmsp-nav button[aria-current]').focus(); }
function closePanel() { CM.open = false; const p = $('#cmsp'); if (p) p.classList.remove('cmsp-on'); document.body.style.overflow = ''; $('#lock').focus(); }
function viewOnSite(id) { closePanel(); if (location.hash === '#' + id) onHash(); else location.hash = id; const t = document.getElementById(id); if (t) { t.setAttribute('tabindex', '-1'); t.focus({ preventScroll: true }); } }

/* ===================== START ===================== */
(async function () {
  const saved = await dbGet();
  if (saved && saved.v === DEFAULTS.v) S = merge(clone(DEFAULTS), saved);
  renderSite(); onHash(true); updateLock();
})();

</script>
</body>
